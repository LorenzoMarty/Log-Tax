[tool.poetry]
name = "log-tax-api"
version = "0.1.0"
description = "Log Tax backend (FastAPI)"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = ">=0.115,<1"
uvicorn = { version = ">=0.32,<1", extras = ["standard"] }
pydantic = ">=2.9,<3"
pydantic-settings = ">=2.6,<3"
httpx = ">=0.27,<1"
pyjwt = {version = ">=2.9,<3", extras = ["crypto"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
pytest-asyncio = ">=0.24,<2"
pytest-cov = ">=6,<8"
ruff = ">=0.8,<1"
mypy = ">=1.13,<2"
import-linter = ">=2.1,<3"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "N817"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]
