<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão · Log Tax</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #14161b; color: #e5e7eb; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 28rem; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: #b6bac4; line-height: 1.5; margin: 0 0 24px; }
      button { font: inherit; font-weight: 600; padding: 12px 20px; border: 0; border-radius: 10px; background: #1fbf8a; color: #0d0f13; cursor: pointer; }
      button:focus-visible { outline: 3px solid #e5e7eb; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>O Log Tax precisa de internet para mostrar os seus dados. Seus dados continuam guardados com segurança. Conecte-se e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
